apiVersion: v1
kind: Pod
metadata:
  name: subscriber
  namespace: pg-lab
spec:
  containers:
    - name: postgres
      image: postgres:18-alpine
      env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab-app
              key: password
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: lab-app
              key: password
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql
      readinessProbe:
        exec:
          command: [pg_isready, -h, "127.0.0.1", -U, postgres]
        periodSeconds: 2
  volumes:
    - name: pgdata
      emptyDir: {}
